version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/uploads:/var/www/html/public/uploads:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://ourstory.whaleestudio.my.id
      - NEXT_PUBLIC_API_URL=https://ourstory.whaleestudio.my.id/api
      - DATABASE_URL=postgresql://user:password@db:5432/our_universe?schema=public
      - COUPLE_PASSCODE_HASH=${COUPLE_PASSCODE_HASH}
    depends_on:
      - db
    volumes:
      - ./data/uploads:/app/public/uploads
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=https://ourstory.whaleestudio.my.id
      - SANCTUM_STATEFUL_DOMAINS=ourstory.whaleestudio.my.id
      - SESSION_DOMAIN=ourstory.whaleestudio.my.id
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=our_universe
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - SESSION_DRIVER=database
    volumes:
      - ./data/uploads:/var/www/html/public/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=our_universe
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
