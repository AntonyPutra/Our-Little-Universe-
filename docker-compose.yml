version: '3.8'

services:
  app:
    build:
      context: .
    container_name: our-universe-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-our_universe}:${DB_PASSWORD:-change_me_super_secret_password}@db:5432/${DB_NAME:-our_universe}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - universe-network

  db:
    image: postgres:17-alpine
    container_name: our-universe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-our_universe}
      POSTGRES_USER: ${DB_USER:-our_universe}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-our_universe} -d ${DB_NAME:-our_universe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - universe-network

networks:
  universe-network:
    driver: bridge
